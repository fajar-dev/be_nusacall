openapi: 3.0.0
info:
  title: NusaCall API
  description: >-
    API Documentation for NusaCall — the WhatsApp Business Calling backend for Nusanet.
    NusaCall owns calling only (signaling, media, routing); nusawa remains the source of
    truth for agent identity and contacts. The frontend never talks to nusawa directly —
    every nusawa call is relayed through this backend. See docs/INTEGRATION-NUSAWA.md.
    Language is detected from the `Accept-Language` header (`en` default, `id` supported)
    and echoed back via the `Content-Language` response header on every response.
  version: 1.0.0
servers:
  - url: http://localhost:4100/api
    description: Local development server
  - url: /api
    description: Relative API server

tags:
  - name: Auth
    description: Login/logout — relays credentials to nusawa, issues a NusaCall JWT
  - name: Agent
    description: Agent roster, presence, and call-receiving eligibility
  - name: Contact
    description: Read-only proxy over nusawa's contact directory
  - name: Call
    description: Call history and stats
  - name: Phone Number
    description: Per-number calling configuration, synced to Meta
  - name: Upload
    description: File upload & retrieval via MinIO object storage

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "NusaCall-issued JWT access token. Expires in 8 hours."

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Preferred response language. Supported: `en` (default), `id`.
        Missing or unsupported values fall back to `en`.
      schema:
        type: string
        enum: [en, id]
        default: en
      example: id

  headers:
    ContentLanguage:
      description: Resolved response language (`en` or `id`), echoed back from `Accept-Language`.
      schema:
        type: string
        enum: [en, id]

  schemas:
    # --- Base Wrapper Schemas ---
    BaseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: "Operation successful" }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: "Something went wrong" }
        errors: { type: object, nullable: true, example: null }

    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 422 }
        message: { type: string, example: "Validation failed" }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: "email" }
              message: { type: string, example: "email is required" }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 50 }
        perPage: { type: integer, example: 10 }
        currentPage: { type: integer, example: 1 }
        lastPage: { type: integer, example: 5 }
        from: { type: integer, example: 1 }
        to: { type: integer, example: 10 }

    # --- Auth Schemas ---
    LoginRequest:
      type: object
      required: [email, password]
      description: >-
        The agent's Nusawork email/password. Relayed server-side to nusawa's own
        POST /api/login, then validated via GET /api/me — never called from the browser.
      properties:
        email: { type: string, format: email, example: "agent@nusa.id" }
        password: { type: string, example: "secret123" }

    AuthUser:
      type: object
      properties:
        username: { type: string, example: "agent@nusa.id" }
        displayName: { type: string, nullable: true, example: "Budi Santoso" }
        role: { type: string, nullable: true, example: "agent" }
        canReceiveCalls: { type: boolean, example: true }

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "NusaCall JWT, expires in 8 hours (28800s)"
          example: "eyJhbGciOiJIUzI1NiIs..."
        expiresIn: { type: integer, example: 28800 }
        tokenType: { type: string, example: "Bearer" }
        user: { $ref: "#/components/schemas/AuthUser" }

    # --- Agent Schemas ---
    Agent:
      type: object
      properties:
        username: { type: string, example: "agent@nusa.id" }
        displayName: { type: string, nullable: true, example: "Budi Santoso" }
        role: { type: string, nullable: true, example: "agent" }
        canReceiveCalls: { type: boolean, example: true }
        availability:
          type: string
          enum: [available, busy, away, offline]
          description: Live presence — "offline" if the agent has no active WebSocket connection.
          example: available
        currentCallId: { type: integer, nullable: true, example: null }
        totalCallsHandled: { type: integer, example: 12 }
        lastSeenAt: { type: string, format: date-time, nullable: true, example: "2026-08-23T08:00:00.000Z" }

    UpdateAgentRequest:
      type: object
      required: [canReceiveCalls]
      properties:
        canReceiveCalls: { type: boolean, example: true }

    SetAvailabilityRequest:
      type: object
      required: [availability]
      properties:
        availability: { type: string, enum: [available, busy, away, offline], example: away }

    # --- Contact Schemas (mapped from nusawa's ContactDTO — see docs/INTEGRATION-NUSAWA.md §3.6) ---
    Contact:
      type: object
      properties:
        phoneNumber: { type: string, example: "628123456789" }
        name: { type: string, nullable: true, example: "Budi Santoso" }
        groups: { type: string, nullable: true, example: null }
        timezone: { type: string, nullable: true, example: null }
        branchCode: { type: string, nullable: true, example: null }
        ownedByPhoneNumber: { type: string, example: "628990000000" }
        isGroup: { type: boolean, example: false }
        createdAt: { type: string, format: date-time, example: "2026-08-20T00:00:00.000Z" }
        updatedAt: { type: string, format: date-time, example: "2026-08-20T00:00:00.000Z" }

    # --- Call Schemas ---
    CallStatus:
      type: string
      enum: [pending, ringing, connecting, active, completed, missed, rejected, failed, abandoned]

    Call:
      type: object
      properties:
        id: { type: integer, example: 4821 }
        wacid: { type: string, example: "wacid.ABGGFjFVU2AfAgo6V" }
        phoneNumberId: { type: string, example: "202063559668129" }
        displayPhoneNumber: { type: string, nullable: true, example: "+62 819-8543-21" }
        waId: { type: string, example: "628123456789" }
        profileName: { type: string, nullable: true, example: "Budi" }
        contactName: { type: string, nullable: true, example: "Budi Santoso" }
        inboxId: { type: string, nullable: true, example: "12345" }
        agentUsername: { type: string, nullable: true, example: "agent@nusa.id" }
        direction: { type: string, enum: [inbound, outbound] }
        status: { $ref: "#/components/schemas/CallStatus" }
        endReason: { type: string, nullable: true, example: "customer_hangup" }
        errorCode: { type: integer, nullable: true }
        errorMessage: { type: string, nullable: true }
        ringingAt: { type: string, format: date-time, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true, example: 135 }
        setupDurationMs: { type: integer, nullable: true }
        recordingEnabled: { type: boolean }
        transcriptionEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    CallStats:
      type: object
      properties:
        total: { type: integer, example: 42 }
        answered: { type: integer, example: 35 }
        missed: { type: integer, example: 5 }
        rejected: { type: integer, example: 1 }
        failed: { type: integer, example: 1 }
        avgDurationSeconds: { type: number, nullable: true, example: 128.4 }
        avgSetupMs: { type: number, nullable: true, example: 1100 }
        answerRate: { type: number, nullable: true, example: 0.833, description: "answered / total, null when total is 0" }

    # --- Phone Number Schemas ---
    CallHoursDay:
      type: object
      properties:
        day_of_week: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        open_time: { type: string, example: "0800" }
        close_time: { type: string, example: "1700" }

    CallHours:
      type: object
      nullable: true
      properties:
        status: { type: string, enum: [ENABLED, DISABLED] }
        timezone_id: { type: string, example: "Asia/Jakarta" }
        weekly_operating_hours: { type: array, items: { $ref: "#/components/schemas/CallHoursDay" } }
        holiday_schedule:
          type: array
          items:
            type: object
            properties:
              date: { type: string, example: "2026-12-25" }
              start_time: { type: string, example: "0000" }
              end_time: { type: string, example: "2359" }

    PhoneNumber:
      type: object
      properties:
        id: { type: integer, example: 1 }
        phoneNumberId: { type: string, example: "202063559668129" }
        displayPhoneNumber: { type: string, example: "+62 819-8543-21" }
        label: { type: string, example: "Helpdesk Medan" }
        isTestNumber: { type: boolean }
        callingEnabled: { type: boolean }
        callIconVisibility: { type: string, enum: [DEFAULT, DISABLE_ALL] }
        callHours: { $ref: "#/components/schemas/CallHours" }
        callerWhitelist: { type: array, items: { type: string }, example: ["628123456789"] }
        answerTimeoutSeconds: { type: integer, example: 20 }
        routingStrategy: { type: string, example: "pic_then_queue" }
        lastSyncedAt: { type: string, format: date-time, nullable: true }

    UpdatePhoneNumberRequest:
      type: object
      properties:
        label: { type: string }
        callingEnabled: { type: boolean }
        callIconVisibility: { type: string, enum: [DEFAULT, DISABLE_ALL] }
        answerTimeoutSeconds: { type: integer, minimum: 5, maximum: 25 }
        callHours: { $ref: "#/components/schemas/CallHours" }
        callerWhitelist: { type: array, items: { type: string } }

paths:
  # ── Login ─────────────────────────────────────────────────────────────────
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with the agent's Nusawork email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Content-Language: { $ref: "#/components/headers/ContentLanguage" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid email/password, or the nusawa account is inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503":
          description: nusawa (identity provider) is currently unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Logout ───────────────────────────────────────────────────────────────
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Logout the current agent
      description: Clears live presence and the cached nusawa session used for the contact directory.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Current Agent ────────────────────────────────────────────────────────
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Get the currently authenticated agent's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Agent" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Agent Roster ─────────────────────────────────────────────────────────
  /agent:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Agent]
      summary: Get all agents (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: q
          in: query
          description: Search by username or display name
          schema: { type: string }
      responses:
        "200":
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Agent" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /agent/available:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Agent]
      summary: Get agents eligible for calls AND currently online
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available agents retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Agent" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /agent/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Agent]
      summary: Get the currently authenticated agent's profile (alias of /auth/me)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Agent" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /agent/me/availability:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    put:
      tags: [Agent]
      summary: Set the current agent's own availability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvailabilityRequest" }
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          availability: { type: string, enum: [available, busy, away, offline] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /agent/{username}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: username
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Agent]
      summary: Set another agent's call-receiving eligibility (admin/manager action)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: Agent updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Agent" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Contact List (read-only proxy over nusawa) ──────────────────────────
  /contact:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Contact]
      summary: Get the agent's contact list (paginated), proxied from nusawa
      description: >-
        Read-only. NusaCall owns no contact data of its own — this relays to nusawa's
        GET /api/contacts using the agent's own nusawa session, captured at login time.
        Results are cached in-memory per agent for a short TTL (NUSAWA_CONTACT_CACHE_TTL,
        default 30s). If the cached nusawa session has expired, the agent must log in
        again — there is no password on hand to silently re-authenticate with.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          description: Search by contact name or phone number
          schema: { type: string }
      responses:
        "200":
          description: Contacts retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Contact" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized, or the cached nusawa session has expired (re-login required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: nusawa (contact directory) is currently unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Call History ─────────────────────────────────────────────────────────
  /call:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Call]
      summary: Get call history (paginated, filterable)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: q
          in: query
          description: Search by wa_id, contact name, or wacid
          schema: { type: string }
        - name: status
          in: query
          description: Comma-separated statuses, e.g. "missed,rejected"
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [inbound, outbound] }
        - name: agentUsername
          in: query
          schema: { type: string }
        - name: phoneNumberId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, answeredAt, endedAt, durationSeconds] }
        - name: order
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        "200":
          description: Calls retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Call" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/stats:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Call]
      summary: Aggregate call stats (total, answered, missed, answer rate, ...)
      security:
        - bearerAuth: []
      parameters:
        - name: phoneNumberId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Stats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CallStats" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get a single call by id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Call retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Call" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Call not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}/recording:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get a presigned download URL for this call's recording
      description: >-
        Only returns a URL once the recording has been downloaded from Meta and
        stored in MinIO (Fase 2). 404 if not requested/not ready yet, 410 if
        Meta's 7-day retention window passed before we could download it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Presigned URL retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No recording, or not downloaded yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Expired — Meta deleted the media before we downloaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}/transcript:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get a presigned download URL for this call's transcript
      description: Same lifecycle/semantics as /call/{id}/recording, independent artifact.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Presigned URL retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No transcript, or not downloaded yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Expired — Meta deleted the media before we downloaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Phone Number Admin ───────────────────────────────────────────────────
  /phone-number:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Phone Number]
      summary: Get all configured phone numbers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Phone numbers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PhoneNumber" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /phone-number/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Phone Number]
      summary: Get a single phone number's configuration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Phone number retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PhoneNumber" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Phone number not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [Phone Number]
      summary: Update configuration and push the FULL config to Meta
      description: >-
        call_hours is a REPLACE on Meta's side, not a merge — this endpoint always sends
        the complete config. Changes can take up to 7 days to propagate to WhatsApp clients.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePhoneNumberRequest" }
      responses:
        "200":
          description: Updated and synced to Meta successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PhoneNumber" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Phone number not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "502":
          description: Meta rejected the settings push (local save is kept regardless)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /phone-number/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Phone Number]
      summary: Re-push the current local config to Meta without changing it
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Synced successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PhoneNumber" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Meta rejected the settings push
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /phone-number/{id}/health:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Phone Number]
      summary: Get the phone number's health status from Meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Meta's raw health_status payload — docs/INTEGRATION-META.md §5.5
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Meta Graph API error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Upload File ──────────────────────────────────────────────────────────
  /upload:
    post:
      tags: [Upload]
      summary: Upload a file to MinIO
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path: { type: string, example: "uploads/abc-123.png" }
        "400":
          description: No file uploaded or invalid file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Proxy File ───────────────────────────────────────────────────────────
  /proxy:
    get:
      tags: [Upload]
      summary: Stream a file stored in MinIO
      description: Public endpoint (no auth) that streams the raw file content for the given object path, e.g. the `path` returned by `POST /upload`.
      parameters:
        - name: path
          in: query
          required: true
          description: Object path/key in the MinIO bucket
          schema: { type: string }
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Missing 'path' query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Missing 'path' query parameter" }
