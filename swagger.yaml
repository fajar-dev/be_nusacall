openapi: 3.0.0
info:
  title: NusaCall API
  description: >-
    API Documentation for NusaCall — the WhatsApp Business Calling backend for Nusanet.
    NusaCall owns calling (signaling, media, routing) and its own user identity (User/
    Organization) — auth no longer depends on nusawa, and inbound routing broadcasts to
    every available agent rather than looking anything up from nusawa. The only remaining
    integration point is posting a call-outcome message into the customer's nusawa thread
    after each call.
    Language is detected from the `Accept-Language` header (`en` default, `id` supported)
    and echoed back via the `Content-Language` response header on every response.
  version: 1.0.0
servers:
  - url: http://localhost:4100/api
    description: Local development server
  - url: /api
    description: Relative API server

tags:
  - name: Auth
    description: Login/logout — validates the Nusawork password (or a Google ID token) against a local User, issues a NusaCall JWT
  - name: User
    description: User roster and live presence. Every user can receive calls — there is no eligibility flag; availability is purely live WebSocket presence with no manual toggle (available on connect, offline on disconnect)
  - name: Organization
    description: Organization tree, used to group and filter users
  - name: Call
    description: Call history and stats
  - name: Account
    description: Per-number calling configuration, synced to Meta
  - name: Upload
    description: File upload & retrieval via MinIO object storage

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "NusaCall-issued JWT access token. Expires in 8 hours."

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Preferred response language. Supported: `en` (default), `id`.
        Missing or unsupported values fall back to `en`.
      schema:
        type: string
        enum: [en, id]
        default: en
      example: id

  headers:
    ContentLanguage:
      description: Resolved response language (`en` or `id`), echoed back from `Accept-Language`.
      schema:
        type: string
        enum: [en, id]

  schemas:
    # --- Base Wrapper Schemas ---
    BaseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        message: { type: string, example: "Operation successful" }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: "Something went wrong" }
        errors: { type: object, nullable: true, example: null }

    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 422 }
        message: { type: string, example: "Validation failed" }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: "email" }
              message: { type: string, example: "email is required" }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer, example: 50 }
        perPage: { type: integer, example: 10 }
        currentPage: { type: integer, example: 1 }
        lastPage: { type: integer, example: 5 }
        from: { type: integer, example: 1 }
        to: { type: integer, example: 10 }

    # --- Auth Schemas ---
    LoginRequest:
      type: object
      required: [email, password]
      description: >-
        The user's Nusawork email/password. Validated server-side against Nusawork's
        OAuth2 password grant — never called from the browser. Identity itself (who
        this user is) is sourced from NusaCall's own User table, not Nusawork.
      properties:
        email: { type: string, format: email, example: "agent@nusa.id" }
        password: { type: string, example: "secret123" }

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          {
            type: string,
            description: "Google ID token from the frontend's Google Sign-In flow.",
          }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "NusaCall JWT, expires in 15 minutes"
          example: "eyJhbGciOiJIUzI1NiIs..."
        refreshToken:
          type: string
          description: "NusaCall refresh JWT, expires in 7 days"
        user: { $ref: "#/components/schemas/User" }

    # --- User Schemas ---
    UserSummary:
      type: object
      description: Lean user shape embedded in other resources (e.g. Call.user)
      properties:
        id: { type: integer, example: 42 }
        name: { type: string, example: "Budi Santoso" }
        email: { type: string, format: email, example: "agent@nusa.id" }
        photo: { type: string, nullable: true, format: uri }
        organization:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 3 }
            name: { type: string, example: "Helpdesk Medan" }

    User:
      type: object
      properties:
        id: { type: integer, example: 42 }
        employeeId: { type: integer, example: 12345 }
        name: { type: string, example: "Budi Santoso" }
        photo: { type: string, nullable: true, format: uri }
        email: { type: string, format: email, example: "agent@nusa.id" }
        isActive: { type: boolean, example: true }
        role: { type: string, enum: [admin, agent, manager], example: agent }
        organization:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 3 }
            name: { type: string, example: "Helpdesk Medan" }
        availability:
          type: string
          enum: [available, offline]
          description: >-
            Live presence — "available" for the entire lifetime of the user's
            WebSocket connection, "offline" once it closes. There is no manual
            toggle; being on a call is expressed by `currentCallId`, not a
            separate availability value. Merged in on every response that
            serializes a User (index, show, options, me, available).
          example: available
        currentCallId: { type: integer, nullable: true, example: null }

    CreateUserRequest:
      type: object
      required: [name, email, role, employeeId]
      properties:
        name: { type: string, example: "Budi Santoso" }
        email: { type: string, format: email, example: "agent@nusa.id" }
        photo: { type: string, nullable: true }
        role: { type: string, enum: [admin, agent, manager], example: agent }
        employeeId: { type: integer, example: 12345 }
        organizationId: { type: integer, example: 3 }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        photo: { type: string, nullable: true }
        role: { type: string, enum: [admin, agent, manager] }
        employeeId: { type: integer }
        organizationId: { type: integer }

    # --- Organization Schemas ---
    OrganizationListItem:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: "Helpdesk Medan" }

    # --- Call Schemas ---
    CallStatus:
      type: string
      enum:
        [
          pending,
          ringing,
          connecting,
          active,
          completed,
          missed,
          rejected,
          failed,
          abandoned,
        ]

    Call:
      type: object
      properties:
        id: { type: integer, example: 4821 }
        wacid: { type: string, example: "wacid.ABGGFjFVU2AfAgo6V" }
        phoneNumberId: { type: string, example: "202063559668129" }
        displayPhoneNumber:
          { type: string, nullable: true, example: "+62 819-8543-21" }
        waId: { type: string, example: "628123456789" }
        contact:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Contact" }]
        user:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
        direction: { type: string, enum: [inbound, outbound] }
        status: { $ref: "#/components/schemas/CallStatus" }
        endReason: { type: string, nullable: true, example: "customer_hangup" }
        errorCode: { type: integer, nullable: true }
        errorMessage: { type: string, nullable: true }
        ringingAt: { type: string, format: date-time, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true, example: 135 }
        setupDurationMs: { type: integer, nullable: true }
        recordingEnabled: { type: boolean }
        transcriptionEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    CallStats:
      type: object
      properties:
        total: { type: integer, example: 42 }
        answered: { type: integer, example: 35 }
        missed: { type: integer, example: 5 }
        rejected: { type: integer, example: 1 }
        failed: { type: integer, example: 1 }
        avgDurationSeconds: { type: number, nullable: true, example: 128.4 }
        avgSetupMs: { type: number, nullable: true, example: 1100 }
        answerRate:
          {
            type: number,
            nullable: true,
            example: 0.833,
            description: "answered / total, null when total is 0",
          }

    # --- Account Schemas ---
    CallHoursDay:
      type: object
      properties:
        day_of_week:
          {
            type: string,
            enum:
              [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY],
          }
        open_time: { type: string, example: "0800" }
        close_time: { type: string, example: "1700" }

    CallHours:
      type: object
      nullable: true
      properties:
        status: { type: string, enum: [ENABLED, DISABLED] }
        timezone_id: { type: string, example: "Asia/Jakarta" }
        weekly_operating_hours:
          { type: array, items: { $ref: "#/components/schemas/CallHoursDay" } }
        holiday_schedule:
          type: array
          items:
            type: object
            properties:
              date: { type: string, example: "2026-12-25" }
              start_time: { type: string, example: "0000" }
              end_time: { type: string, example: "2359" }

    Account:
      type: object
      properties:
        id: { type: integer, example: 1 }
        appId: { type: string, nullable: true, example: "1234567890123456" }
        phoneNumberId: { type: string, example: "202063559668129" }
        displayPhoneNumber: { type: string, example: "+62 819-8543-21" }
        label: { type: string, example: "Helpdesk Medan" }
        isTestNumber: { type: boolean }
        callingEnabled: { type: boolean }
        callIconVisibility: { type: string, enum: [DEFAULT, DISABLE_ALL] }
        color: { type: string, example: "#6366F1", description: "Hex swatch shown against this number's calls on the live call board" }
        callHours: { $ref: "#/components/schemas/CallHours" }
        answerTimeoutSeconds: { type: integer, example: 20 }
        lastSyncedAt: { type: string, format: date-time, nullable: true }

    UpdateAccountRequest:
      type: object
      properties:
        label: { type: string }
        callingEnabled: { type: boolean }
        callIconVisibility: { type: string, enum: [DEFAULT, DISABLE_ALL] }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", example: "#6366F1" }
        answerTimeoutSeconds: { type: integer, minimum: 5, maximum: 25 }
        callHours: { $ref: "#/components/schemas/CallHours" }

    Contact:
      type: object
      properties:
        id: { type: integer, example: 1 }
        waId: { type: string, example: "628123456789" }
        profileName: { type: string, nullable: true, example: "Budi" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

paths:
  # ── Login ─────────────────────────────────────────────────────────────────
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with the user's Nusawork email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          headers:
            Content-Language: { $ref: "#/components/headers/ContentLanguage" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: User not registered locally, account is inactive, or the Nusawork password is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Google Login ─────────────────────────────────────────────────────────
  /auth/google:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Login with a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleLoginRequest" }
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: No local User registered for this Google account's email, or the account is inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Refresh Token ────────────────────────────────────────────────────────
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ── Logout ───────────────────────────────────────────────────────────────
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    post:
      tags: [Auth]
      summary: Logout the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Current User ─────────────────────────────────────────────────────────
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Auth]
      summary: Get the currently authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── User Roster ──────────────────────────────────────────────────────────
  /user:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [User]
      summary: Get all users (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: q
          in: query
          description: Search by name or email
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: organizationId
          in: query
          description: Filter by organization id
          schema: { type: integer }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, email, role, organization, isActive, createdAt] }
        - name: order
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [User]
      summary: Create a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /user/options:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [User]
      summary: Lightweight active-user picker (autocomplete), capped at 50 results
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200":
          description: User options retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /user/me:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [User]
      summary: Get the currently authenticated user's profile (alias of /auth/me), with live presence
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /user/available:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [User]
      summary: Get users currently online (live WebSocket connection) and free to take a call
      description: >-
        There is no eligibility flag anymore — every user can receive calls.
        A user appears here purely based on live presence (connected, not
        already on a call), not any stored roster setting.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /user/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [User]
      summary: Get a single user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [User]
      summary: Update a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
    delete:
      tags: [User]
      summary: Soft-delete a user (anonymizes email, deactivates)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Organization ──────────────────────────────────────────────────────────
  /organization/list:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Organization]
      summary: Get a flat, unpaginated list of all organizations (for filters/pickers)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/OrganizationListItem" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Call History ─────────────────────────────────────────────────────────
  /call:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Call]
      summary: Get call history (paginated, filterable)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: q
          in: query
          description: Search by wa_id, contact name, profile name, or wacid
          schema: { type: string }
        - name: status
          in: query
          description: Comma-separated statuses, e.g. "missed,rejected"
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [inbound, outbound] }
        - name: userId
          in: query
          schema: { type: integer }
        - name: phoneNumberId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: sortBy
          in: query
          schema:
            {
              type: string,
              enum: [createdAt, answeredAt, endedAt, durationSeconds],
            }
        - name: order
          in: query
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        "200":
          description: Calls retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Call" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/stats:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Call]
      summary: Aggregate call stats (total, answered, missed, answer rate, ...)
      security:
        - bearerAuth: []
      parameters:
        - name: phoneNumberId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Stats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CallStats" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get a single call by id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Call retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Call" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Call not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}/recording:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get a presigned download URL for this call's recording
      description: >-
        Only returns a URL once the recording has been downloaded from Meta and
        stored in MinIO. 404 if not requested/not ready yet, 410 if
        Meta's 7-day retention window passed before we could download it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Presigned URL retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No recording, or not downloaded yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Expired — Meta deleted the media before we downloaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /call/{id}/transcript:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Call]
      summary: Get this call's transcript content
      description: >-
        Same PENDING/EXPIRED lifecycle as /call/{id}/recording, but returns the
        parsed transcript JSON directly (Meta's documented shape: metadata,
        transcript.text/language/confidence, transcript.segments[] with
        speaker/channel/start/end/words) rather than a URL — the browser needs
        to actually read this, and a MinIO presigned URL may not have CORS
        enabled for direct fetch, so this goes through the authenticated API
        instead of the object store directly.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transcript content retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Meta's transcript document — see description above
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No transcript, or not downloaded yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Expired — Meta deleted the media before we downloaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Account Admin ────────────────────────────────────────────────────────
  /account:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
    get:
      tags: [Account]
      summary: Get all configured accounts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Account" }
                      meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Account]
      summary: Get a single account's configuration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Account" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Account not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [Account]
      summary: Update configuration and push the FULL config to Meta
      description: >-
        call_hours is a REPLACE on Meta's side, not a merge — this endpoint always sends
        the complete config. Changes can take up to 7 days to propagate to WhatsApp clients.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Updated and synced to Meta successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Account" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Account not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "502":
          description: Meta rejected the settings push (local save is kept regardless)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Account]
      summary: Re-push the current local config to Meta without changing it
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Synced successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Account" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Meta rejected the settings push
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/{id}/health:
    parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Account]
      summary: Get the account's health status from Meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Health status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Meta's raw health_status payload
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Meta Graph API error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

