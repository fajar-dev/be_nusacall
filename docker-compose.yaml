services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusacall-be
    restart: always
    ports:
      - "${PORT:-4100}:4100"
    environment:
      - PORT=4100
      - NODE_ENV=${NODE_ENV:-production}
      - APP_URL=${APP_URL}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-nusacall}
      - DB_NAME=${DB_NAME:-nusacall}
      - DB_SYNC=${DB_SYNC:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-28800}
      - API_KEY=${API_KEY}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v18.0}
      - META_GRAPH_BASE_URL=${META_GRAPH_BASE_URL:-https://graph.facebook.com}
      - NUSAWA_BASE_URL=${NUSAWA_BASE_URL}
      - NUSAWA_API_KEY=${NUSAWA_API_KEY}
      - NUSAWA_WEB_URL=${NUSAWA_WEB_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-nusacall-recordings}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nusacall-be-network

  db:
    image: mysql:8.0
    container_name: nusacall-be-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS:-nusacall}
      - MYSQL_DATABASE=${DB_NAME:-nusacall}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASS:-nusacall}"]
      timeout: 10s
      retries: 5
    networks:
      - nusacall-be-network

networks:
  nusacall-be-network:
    driver: bridge

volumes:
  mysql_data:
